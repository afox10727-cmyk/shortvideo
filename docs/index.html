<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>ShortVideo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--surface:rgba(255,255,255,.06);--text:#fff;--text2:rgba(255,255,255,.5);
  --accent:#FF2D55;--accent2:#FF3B30;--safe-top:env(safe-area-inset-top,20px);
  --safe-bottom:env(safe-area-inset-bottom,20px);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100dvh;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

/* Screens */
.screen{display:none;position:fixed;inset:0;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}
.auth-screen{align-items:center;justify-content:center;gap:20px;padding:40px 32px}
.auth-logo{width:72px;height:72px;background:linear-gradient(135deg,#FF2D55,#FF6B35);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px}
.auth-title{font-size:28px;font-weight:700}
.auth-tabs{display:flex;background:var(--surface);border-radius:10px;padding:3px;width:100%}
.auth-tab{flex:1;text-align:center;padding:10px;border-radius:8px;color:var(--text2);font-size:15px;cursor:pointer;border:none;background:0 0;font:inherit}
.auth-tab.active{background:rgba(255,255,255,.15);color:var(--text)}
.auth-input{width:100%;padding:14px 16px;background:var(--surface);border:none;border-radius:12px;color:var(--text);font-size:16px;outline:0;font:inherit}
.auth-input::placeholder{color:rgba(255,255,255,.3)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#FF2D55,#FF3B30);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font:inherit}
.btn:active{opacity:.8}
.btn-sm{padding:8px 16px;font-size:14px;width:auto;border-radius:8px}
.btn-outline{background:var(--surface);color:var(--text);font-weight:400}
.btn-ghost{background:0 0;color:var(--text);font-weight:400;border:1px solid rgba(255,255,255,.2)}
.divider{display:flex;align-items:center;gap:12px;width:100%;color:var(--text2);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}

/* Feed */
.feed-screen{background:#000;overflow:hidden}
.feed-top{position:fixed;top:0;left:0;right:0;z-index:10;padding:var(--safe-top) 16px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}
.feed-tabs{display:flex;background:rgba(255,255,255,.15);border-radius:8px;padding:2px;backdrop-filter:blur(10px)}
.feed-tab{padding:6px 18px;border-radius:6px;font-size:14px;border:none;background:0 0;color:var(--text);font:inherit;cursor:pointer}
.feed-tab.active{background:rgba(255,255,255,.25)}
.feed-spacer{flex:1}
.feed-video{width:100%;height:100dvh;position:relative;overflow:hidden;scroll-snap-align:start}
.feed-video-inner{width:100%;height:100%;object-fit:cover;background:#111}
.feed-actions{position:absolute;right:12px;bottom:140px;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:5}
.feed-action{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:0 0;border:none;font:inherit;color:var(--text)}
.feed-action svg{width:32px;height:32px;transition:.15s}
.feed-action.liked svg{fill:#FF2D55;color:#FF2D55}
.feed-info{position:absolute;left:16px;right:70px;bottom:100px;display:flex;flex-direction:column;gap:8px;z-index:5}
.feed-username{color:var(--text);font-size:16px;font-weight:600}
.feed-caption{color:var(--text);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feed-tags{display:flex;gap:6px;flex-wrap:wrap}
.feed-tag{padding:4px 10px;background:rgba(255,255,255,.12);border-radius:12px;font-size:12px}
.feed-scroll{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.feed-scroll::-webkit-scrollbar{display:none}

/* Tab bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:calc(56px + var(--safe-bottom));display:flex;align-items:flex-start;padding:6px 0 var(--safe-bottom);background:rgba(0,0,0,.92);border-top:1px solid rgba(255,255,255,.06);z-index:20}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:0 0;color:var(--text2);font-size:10px;font:inherit;transition:.15s;padding:4px}
.tab-btn.active{color:var(--text)}
.tab-btn svg{width:24px;height:24px}
.tab-center{flex:1;display:flex;justify-content:center}
.tab-record{width:48px;height:48px;background:linear-gradient(135deg,#FF2D55,#FF3B30);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:24px;margin-top:-8px;font:inherit}

/* Record */
.record-screen{background:#000;overflow:hidden}
.record-camera{width:100%;height:100dvh;object-fit:cover;background:#111}
.record-top{position:fixed;top:var(--safe-top);left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:10}
.record-close{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);border:none;color:#fff;font-size:20px;cursor:pointer;font:inherit;display:flex;align-items:center;justify-content:center}
.record-bottom{position:fixed;bottom:calc(40px + var(--safe-bottom));left:0;right:0;display:flex;align-items:center;justify-content:center;gap:40px;z-index:10}
.record-btn-outer{width:76px;height:76px;border-radius:50%;border:4px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.record-btn-inner{width:60px;height:60px;border-radius:50%;background:#FF3B30;transition:.2s}
.record-btn-outer.recording{border-color:#FF3B30}
.record-btn-outer.recording .record-btn-inner{width:28px;height:28px;border-radius:6px}
.record-timer{position:fixed;top:calc(var(--safe-top) + 60px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(0,0,0,.5);border-radius:20px;font-size:14px;font-family:monospace}

/* Upload modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:30;display:none;flex-direction:column;justify-content:flex-end}
.modal.active{display:flex}
.modal-content{background:#1c1c1e;border-radius:20px 20px 0 0;padding:24px;display:flex;flex-direction:column;gap:16px;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;align-self:center}
.modal-title{font-size:18px;font-weight:600;text-align:center}
.modal-input{width:100%;padding:12px;background:var(--surface);border:none;border-radius:10px;color:var(--text);font-size:16px;outline:0;font:inherit;resize:none}
.modal-input::placeholder{color:var(--text2)}
.progress-bar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#FF2D55,#FF3B30);border-radius:3px;transition:width .3s;width:0}

/* Profile */
.profile-screen{padding:var(--safe-top) 16px calc(70px + var(--safe-bottom))}
.profile-header{display:flex;align-items:center;gap:20px;margin:8px 0 16px}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#FF2D55,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
.profile-stats{display:flex;gap:24px;flex:1;justify-content:space-around}
.profile-stat{text-align:center}
.profile-stat .num{font-size:18px;font-weight:700}
.profile-stat .lbl{color:var(--text2);font-size:12px}
.profile-name{font-size:18px;font-weight:600;margin-bottom:2px}
.profile-bio{color:var(--text2);font-size:13px;margin-bottom:12px}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.profile-cell{aspect-ratio:9/16;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:24px;cursor:pointer}

/* Discover */
.discover-screen{padding:var(--safe-top) 16px calc(70px + var(--safe-bottom))}
.search-box{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-radius:12px;margin-bottom:20px}
.search-box input{flex:1;background:0 0;border:none;color:var(--text);font-size:16px;outline:0;font:inherit}
.search-box input::placeholder{color:var(--text2)}
.trending-label{font-size:18px;font-weight:600;margin-bottom:12px}
.trending-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.trending-tag{padding:12px;background:var(--surface);border-radius:10px;font-size:14px;cursor:pointer;border:none;font:inherit;color:var(--text);text-align:left}

/* Notifications */
.notify-screen{padding:var(--safe-top) 0 calc(70px + var(--safe-bottom))}
.notify-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.notify-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.notify-text{flex:1}
.notify-text .title{font-size:14px}
.notify-text .time{color:var(--text2);font-size:12px}
.notify-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* Toast */
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* Spinner */
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Offline banner */
.offline-bar{position:fixed;top:calc(var(--safe-top) + 60px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(255,149,0,.9);border-radius:20px;font-size:12px;z-index:25}
.offline-bar.hidden{display:none}
</style>
</head>
<body>

<!-- ═══ Auth Screen ═══ -->
<div id="authScreen" class="screen active">
  <div class="auth-screen">
    <div class="auth-logo">▶</div>
    <h1 class="auth-title">ShortVideo</h1>
    <div class="auth-tabs" id="authTabs">
      <button class="auth-tab active" onclick="switchAuth('login')">登录</button>
      <button class="auth-tab" onclick="switchAuth('signup')">注册</button>
    </div>
    <div id="signupFields" style="display:none;width:100%;display:none;flex-direction:column;gap:12px">
      <input class="auth-input" id="signupName" placeholder="昵称">
      <input class="auth-input" id="signupUsername" placeholder="用户名">
    </div>
    <input class="auth-input" id="emailInput" type="email" placeholder="邮箱" autocomplete="email">
    <input class="auth-input" id="passInput" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn" id="authBtn" onclick="doAuth()">登录</button>
    <div class="divider">或</div>
    <button class="btn btn-outline" onclick="quickDemo()" style="color:#FFD60A">⚡ 快速体验（免注册）</button>
    <div id="authError" style="color:#FF453A;font-size:13px;text-align:center;display:none"></div>
  </div>
</div>

<!-- ═══ Feed Screen ═══ -->
<div id="feedScreen" class="screen">
  <div class="feed-top">
    <div class="feed-tabs">
      <button class="feed-tab active" onclick="switchFeedTab(this,'推荐')">推荐</button>
      <button class="feed-tab" onclick="switchFeedTab(this,'关注')">关注</button>
    </div>
    <div class="feed-spacer"></div>
    <button class="btn btn-sm btn-ghost" onclick="navigate('discover')">🔍</button>
  </div>
  <div class="feed-scroll" id="feedScroll" onscroll="onFeedScroll()">
    <div id="feedContainer"></div>
    <div id="feedLoader" style="text-align:center;padding:20px"><div class="spinner" style="margin:0 auto"></div></div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="navigate('feed')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>首页</button>
    <button class="tab-btn" onclick="navigate('discover')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>发现</button>
    <div class="tab-center"><button class="tab-record" onclick="navigate('record')">+</button></div>
    <button class="tab-btn" onclick="navigate('notify')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>通知</button>
    <button class="tab-btn" onclick="navigate('profile')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>我</button>
  </div>
</div>

<!-- ═══ Record Screen ═══ -->
<div id="recordScreen" class="screen">
  <div class="record-top">
    <button class="record-close" onclick="stopCamera();navigate('feed')">✕</button>
    <button class="record-close" onclick="flipCamera()">🔄</button>
  </div>
  <video id="cameraPreview" class="record-camera" autoplay playsinline muted></video>
  <div class="record-timer" id="recordTimer" style="display:none"><span style="width:8px;height:8px;border-radius:50%;background:red"></span><span id="timerText">00:00</span></div>
  <div class="record-bottom">
    <button class="record-close" onclick="showToast('相册选择')">🖼</button>
    <div class="record-btn-outer" id="recordBtn" onclick="toggleRecording()">
      <div class="record-btn-inner"></div>
    </div>
    <span style="color:var(--text2);font-size:12px;width:40px;text-align:center">03:00</span>
  </div>
  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <div class="modal-handle"></div>
      <div class="modal-title">发布视频</div>
      <textarea class="modal-input" id="uploadCaption" placeholder="添加视频描述..." rows="2"></textarea>
      <input class="modal-input" id="uploadTags" placeholder="#标签 (空格分隔)">
      <div class="progress-bar" id="progressBar" style="display:none"><div class="progress-fill" id="progressFill"></div></div>
      <button class="btn" id="publishBtn" onclick="publishVideo()">发布</button>
      <button class="btn btn-ghost" onclick="document.getElementById('uploadModal').classList.remove('active')" style="margin-top:0">取消</button>
    </div>
  </div>
</div>

<!-- ═══ Discover Screen ═══ -->
<div id="discoverScreen" class="screen">
  <div class="discover-screen">
    <h2 style="font-size:22px;font-weight:700;margin-bottom:16px">发现</h2>
    <div class="search-box">
      <span style="color:var(--text2)">🔍</span>
      <input type="text" placeholder="搜索用户" oninput="searchUsers(this.value)">
    </div>
    <div class="trending-label">🔥 热门话题</div>
    <div class="trending-grid" id="trendingGrid">
      <button class="trending-tag" onclick="showToast('搜索: 搞笑')">#搞笑<span style="color:orange;font-size:11px;float:right">热门</span></button>
      <button class="trending-tag" onclick="showToast('搜索: 舞蹈')">#舞蹈<span style="color:orange;font-size:11px;float:right">热门</span></button>
      <button class="trending-tag" onclick="showToast('搜索: 美食')">#美食</button>
      <button class="trending-tag" onclick="showToast('搜索: 旅行')">#旅行</button>
      <button class="trending-tag" onclick="showToast('搜索: 音乐')">#音乐</button>
      <button class="trending-tag" onclick="showToast('搜索: 时尚')">#时尚</button>
      <button class="trending-tag" onclick="showToast('搜索: 运动')">#运动</button>
      <button class="trending-tag" onclick="showToast('搜索: 宠物')">#宠物</button>
    </div>
    <div class="trending-label" style="margin-top:20px">👥 推荐用户</div>
    <div id="searchResults" style="color:var(--text2);text-align:center;padding:20px">配置 Firebase 后可搜索真实用户</div>
  </div>
</div>

<!-- ═══ Notification Screen ═══ -->
<div id="notifyScreen" class="screen">
  <div class="notify-screen">
    <h2 style="font-size:22px;font-weight:700;padding:0 16px 8px">通知</h2>
    <div id="notifyList">
      <div class="notify-item">
        <div class="notify-icon" style="background:rgba(255,59,48,.2)">❤️</div>
        <div class="notify-text"><div class="title">@user_abc 赞了你的视频</div><div class="time">3分钟前</div></div>
      </div>
      <div class="notify-item">
        <div class="notify-icon" style="background:rgba(0,122,255,.2)">💬</div>
        <div class="notify-text"><div class="title">@user_xyz 评论了你的视频</div><div class="time">15分钟前</div></div>
      </div>
      <div class="notify-item">
        <div class="notify-icon" style="background:rgba(52,199,89,.2)">👤</div>
        <div class="notify-text"><div class="title">@new_friend 关注了你</div><div class="time">1小时前</div></div>
      </div>
      <div style="color:var(--text2);font-size:13px;text-align:center;padding:20px">更多通知将在配置 Firebase 后显示</div>
    </div>
  </div>
</div>

<!-- ═══ Profile Screen ═══ -->
<div id="profileScreen" class="screen">
  <div class="profile-screen">
    <h2 style="font-size:22px;font-weight:700;margin-bottom:16px">我</h2>
    <div class="profile-header">
      <div class="profile-avatar">😎</div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="num" id="profileVideos">0</div><div class="lbl">视频</div></div>
        <div class="profile-stat" onclick="showToast('粉丝列表')"><div class="num" id="profileFollowers">0</div><div class="lbl">粉丝</div></div>
        <div class="profile-stat" onclick="showToast('关注列表')"><div class="num" id="profileFollowing">0</div><div class="lbl">关注</div></div>
      </div>
    </div>
    <div class="profile-name" id="profileName">@demo_user</div>
    <div class="profile-bio" id="profileBio">演示模式</div>
    <button class="btn btn-outline btn-sm" onclick="showToast('编辑资料')" style="width:100%;margin-bottom:16px">编辑资料</button>
    <div class="profile-grid" id="profileGrid">
      <div class="profile-cell">📹</div><div class="profile-cell">🎬</div><div class="profile-cell">🎥</div>
      <div class="profile-cell">📽</div><div class="profile-cell">🎞</div><div class="profile-cell">▶️</div>
    </div>
    <button class="btn btn-outline btn-sm" onclick="signOutUser()" style="width:100%;margin-top:24px;color:#FF453A">退出登录</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Offline Bar -->
<div class="offline-bar hidden" id="offlineBar">📡 无网络连接</div>

<script type="module">
// ── Firebase Init ──
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
import { getFirestore,collection,addDoc,getDocs,query,orderBy,limit,startAfter,where,doc,setDoc,deleteDoc,getDoc,serverTimestamp,updateDoc,increment } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';
import { getStorage,ref,uploadBytesResumable,getDownloadURL } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js';

const firebaseConfig = {
  apiKey: "AIzaSyD8UrKNDeHIKEmDShUbVLXq_k_ze1YjR6w",
  authDomain: "shortvideo-app-29489.firebaseapp.com",
  projectId: "shortvideo-app-29489",
  storageBucket: "shortvideo-app-29489.firebasestorage.app",
  messagingSenderId: "853700118187",
  appId: "1:853700118187:web:a7cc3ea237867d23bb99ee"
};

let app,auth,db,storage;
let currentUser = null;
let isDemoMode = false;

try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  storage = getStorage(app);
} catch(e) {
  console.warn('Firebase not configured yet. Demo mode active.');
  isDemoMode = true;
}

// ── Make globals available ──
window.db = db; window.auth = auth; window.storage = storage;
window.currentUser = null; window.isDemoMode = isDemoMode;
</script>

<script src="app.js"></script>
</body>
</html>
